<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./images/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="./svg/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="'./images/favicon.png" />
    <title>Сладкий сундук — магазин пироженых</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">Сладкий сундук</h1>

      <address class="header__address">
        <div class="header__address-item">
          <img
            class="header__address-logo"
            src="./images/local-icon.png"
            alt="Иконка с изображением геолокации"
          />
          <p class="header__address-text">
            г. Санкт Петербург, <br />ул. Куйбышева 31
          </p>
        </div>

        <div class="header__address-item">
          <img
            class="header__address-logo"
            src="./images/phone-icon.png"
            alt="Иконка с изображением телефона"
          />
          <div>
            <a class="header__address-link" href="tel:88128449549"
              >8 (812) 844-95-49</a
            >
            <p class="header__address-text">Ежедневно с 9:00 до 20:00</p>
          </div>
        </div>
      </address>
    </header>

    <main class="main">
      <section class="cover">
        <div class="cover__subtitle">
          <span class="cover__subtitle-text">вкуснейшие</span>
        </div>

        <h2 class="cover__title">
          Пирожные и капкейки <br />от 150 ₽/шт. с доставкой <br />по Санкт
          Петербургу
        </h2>

        <p class="cover__text">
          Приготовим за 3 часа в день заказа. <br />Доставка на авто в
          холодильнике.
        </p>

        <div class="cover__container">
          <button class="cover__container-button">Перейти в каталог</button>

          <p class="cover__container-text">9 различных <br />видов на выбор</p>
        </div>

        <img
          class="page-accent"
          src="./images/berry.png"
          alt="Размытая иконка малины"
        />
        <img
          class="page-accent"
          src="./images/berry.png"
          alt="Размытая иконка малины"
        />
        <img
          class="page-accent"
          src="./images/berry.png"
          alt="Размытая иконка малины"
        />
        <img
          class="page-accent"
          src="./images/leaf.png"
          alt="Размытая иконка листика"
        />
      </section>

      <section class="catalog content__theme-bright"></section>

      <section class="content content__theme-dark"></section>

      <section class="about content__theme-bright"></section>

      <section class="reviews content__theme-dark"></section>

      <section class="gallery content__theme-bright"></section>

      <section class="reqest content__theme-dark"></section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
